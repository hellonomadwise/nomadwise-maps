<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claim your space · Nomadwise Maps</title>
<meta name="robots" content="noindex">
<!-- nomadmaps.io/claim forwards to the app's ?claim door; a slug after
     it (nomadmaps.io/claim?my-space) is kept. -->
<script>
  var q = location.search ? location.search.replace(/^\?/, '=') : '';
  location.replace('/?claim' + q + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/?claim">
</head>
<body>Opening the claim form…</body>
</html>
