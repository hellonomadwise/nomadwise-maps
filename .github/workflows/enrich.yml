name: Nightly data enrichment

# All the jobs that spend Google Places API credit live here, ONCE A
# NIGHT, instead of on every app build. A busy development day used
# to run them on every push (fifteen times in a day at the worst);
# now it runs them zero times, and the map data still refreshes every
# night. The "Run workflow" button on GitHub triggers an extra run by
# hand when needed.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/webflow_sync.py'
      - 'scripts/enrich_venues.py'
      - '.github/workflows/enrich.yml'

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sync the live nomadwise.io Webflow collection into Nomadmaps
      # venues (slug, website status, editorial facts; inserts newcomers).
      # Matches on the Google Place ID stored on both sides. Read-only
      # towards Webflow; skips itself politely if the token is missing.
      - name: Webflow sync
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          python3 scripts/webflow_sync.py

      # Coordinates, Google snapshots, review-signal scans (including
      # stored opening hours) and city sweeps.
      - name: Enrich venues
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -n "$GOOGLE_PLACES_KEY" ]; then
            python3 scripts/enrich_venues.py
          else
            echo "Skipping enrichment — secrets not set yet."
          fi

      # Reports go to this run's log (readable on GitHub under
      # Actions -> Nightly data enrichment).
      - name: Show reports
        if: always()
        run: |
          for f in ci-debug/*.json; do
            if [ -f "$f" ]; then echo "===== $f"; cat "$f"; echo; fi
          done
          true

      # The sync report also goes to a small "sync-reports" branch so it
      # can be read without opening the Actions log. Never touches main.
      - name: Publish sync report
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f ci-debug/webflow_sync_report.json ]; then exit 0; fi
          git config user.name "nomadwise-bot"
          git config user.email "actions@github.com"
          cp ci-debug/webflow_sync_report.json /tmp/webflow_sync_report.json
          git checkout --orphan sync-reports
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf reports
          mkdir -p reports
          cp /tmp/webflow_sync_report.json reports/webflow_sync_report.json
          git add -f reports/webflow_sync_report.json
          git commit -m "sync: nightly Webflow sync report"
          git push -f origin sync-reports
