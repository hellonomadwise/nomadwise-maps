name: Coworking Google status audit

# On-demand health check for the Webflow Coworking listings. Runs ONLY
# when you click "Run workflow". Uses the Google Places key already in
# this repo's secrets to ask Google each listing's business status, and
# writes ci-debug/coworking_status.csv to the ci-debug branch. Nothing
# else is touched.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

