      - name: Check Google business status
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, csv, time, urllib.request, os
          from collections import Counter
          KEY=os.environ.get("GOOGLE_PLACES_KEY")
          if not KEY: raise SystemExit("No Google Places key secret set.")
          rows=json.load(open("/tmp/audit/input.json"))
          def get(url,headers=None,data=None):
              req=urllib.request.Request(url,headers=headers or {},data=data)
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
          def details(pid):
              url=f"https://places.googleapis.com/v1/places/{pid}?languageCode=en"
              h={"X-Goog-Api-Key":KEY,"X-Goog-FieldMask":"id,displayName,businessStatus"}
              try:
                  d=get(url,headers=h); return d.get("businessStatus","UNKNOWN"),(d.get("displayName") or {}).get("text","")
              except Exception as e: return f"ERROR:{getattr(e,'code','')}",""
          def search(name,city):
              url="https://places.googleapis.com/v1/places:searchText"
              h={"X-Goog-Api-Key":KEY,"Content-Type":"application/json","X-Goog-FieldMask":"places.id,places.displayName,places.businessStatus"}
              body=json.dumps({"textQuery":f"{name} {city}".strip()}).encode()
              try:
                  d=get(url,headers=h,data=body); p=(d.get("places") or [None])[0]
                  if not p: return "NOT_FOUND","",""
                  return p.get("businessStatus","UNKNOWN"),(p.get("displayName") or {}).get("text",""),p.get("id","")
              except Exception as e: return f"ERROR:{getattr(e,'code','')}","",""
          LAB={"OPERATIONAL":"Open","CLOSED_TEMPORARILY":"Temporarily closed","CLOSED_PERMANENTLY":"PERMANENTLY CLOSED","NOT_FOUND":"Not found on Google","UNKNOWN":"Unknown"}
          out=[]
          for i,r in enumerate(rows,1):
              pid=r.get("place_id","")
              if pid: raw,gname=details(pid)
              else: raw,gname,pid=search(r["name"],r.get("city",""))
              out.append({"name":r["name"],"city":r.get("city",""),"item_id":r.get("item_id",""),"place_id":pid,"google_name":gname,"raw_status":raw,"status":LAB.get(raw,raw)})
              time.sleep(0.05)
              if i%50==0: print(f"...{i}/{len(rows)}")
          os.makedirs("ci-debug",exist_ok=True)
          with open("ci-debug/coworking_status.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(out[0].keys())); w.writeheader(); w.writerows(out)
          print("Status tally:",Counter(o["status"] for o in out))
          PYEOF

      - name: Publish result to ci-debug branch
        run: |
          git config user.name "nomadwise-bot"
          git config user.email "actions@github.com"
          git fetch origin ci-debug || true
          git checkout -B ci-debug
          git add -f ci-debug/coworking_status.csv
          git commit -m "audit: coworking Google business status" || true
          git push -f origin ci-debug
