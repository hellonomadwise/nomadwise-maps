name: Booking.com lodging detection (Google types)

# Asks Google Places for the FULL type list of every listing and flags
# any that Google classifies as bookable accommodation (hotel, hostel,
# guest house, resort, B&B, lodging, etc.) — catching places that rent
# rooms even when their headline category says cafe/coworking. Manual
# run only; uses the existing Google key; writes audit/lodging.csv to
# the audit-results branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lodging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write input data
