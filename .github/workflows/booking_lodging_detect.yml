      - name: Detect lodging via Google types
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_SERVER_KEY || secrets.GOOGLE_PLACES_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, csv, time, urllib.request, os
          KEY=os.environ.get("GOOGLE_PLACES_KEY")
          if not KEY: raise SystemExit("No Google Places key secret set.")
          rows=json.load(open("/tmp/a/input.json"))
          LODGING={"lodging","hotel","hostel","guest_house","bed_and_breakfast","resort_hotel","motel",
                   "inn","japanese_inn","budget_japanese_inn","cottage","farmstay","extended_stay_hotel",
                   "private_guest_room","campground","camping_cabin","rv_park","apartment_complex"}
          def get(url,headers=None,data=None):
              req=urllib.request.Request(url,headers=headers or {},data=data)
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
          def details(pid):
              url=f"https://places.googleapis.com/v1/places/{pid}?languageCode=en"
              h={"X-Goog-Api-Key":KEY,"X-Goog-FieldMask":"id,displayName,types,primaryTypeDisplayName,businessStatus"}
              try:
                  d=get(url,headers=h)
                  return d.get("types",[]),(d.get("primaryTypeDisplayName") or {}).get("text",""),d.get("businessStatus","")
              except Exception as e: return [],"",f"ERROR:{getattr(e,'code','')}"
          def search(name,city):
              url="https://places.googleapis.com/v1/places:searchText"
              h={"X-Goog-Api-Key":KEY,"Content-Type":"application/json","X-Goog-FieldMask":"places.id,places.types,places.primaryTypeDisplayName,places.businessStatus"}
              body=json.dumps({"textQuery":f"{name} {city}".strip()}).encode()
              try:
                  d=get(url,headers=h,data=body); p=(d.get("places") or [None])[0]
                  if not p: return [],"","NOT_FOUND",""
                  return p.get("types",[]),(p.get("primaryTypeDisplayName") or {}).get("text",""),p.get("businessStatus",""),p.get("id","")
              except Exception as e: return [],"",f"ERROR:{getattr(e,'code','')}",""
          out=[]
          for i,r in enumerate(rows,1):
              pid=r.get("place_id","")
              if pid: types,ptype,bstat=details(pid)
              else: types,ptype,bstat,pid=search(r["name"],r.get("city",""))
              hits=sorted(set(types) & LODGING)
              out.append({"name":r["name"],"city":r.get("city",""),"kind":r.get("kind",""),
                          "item_id":r.get("item_id",""),"place_id":pid,"primary_type":ptype,
                          "business_status":bstat,"is_lodging":"YES" if hits else "",
                          "lodging_types":", ".join(hits),"all_types":", ".join(types)})
              time.sleep(0.05)
              if i%100==0: print(f"...{i}/{len(rows)}")
          n=sum(1 for o in out if o["is_lodging"])
          print(f"Lodging-flagged: {n}/{len(out)}")
          os.makedirs("audit",exist_ok=True)
          with open("audit/lodging.csv","w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(out[0].keys())); w.writeheader(); w.writerows(out)
          PYEOF
      - name: Publish to audit-results branch
        run: |
          git config user.name "nomadwise-bot"
          git config user.email "actions@github.com"
          cp audit/lodging.csv /tmp/lodging.csv
          git fetch origin audit-results || true
          git checkout audit-results 2>/dev/null || git checkout --orphan audit-results
          rm -rf audit; mkdir -p audit; cp /tmp/lodging.csv audit/lodging.csv
          git add -f audit/lodging.csv
          git commit -m "audit: Google lodging-type detection"
          git push -f origin audit-results
